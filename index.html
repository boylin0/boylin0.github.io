    <!--
      Restores the path that public/404.html encoded into the query string, e.g.
      /?/liveabc&tab=1 becomes /liveabc?tab=1. Must run before the router reads the URL.
    -->
    <script>
      ;((l) => {
        if (l.search[1] !== '/') return
        const decoded = l.search
          .slice(1)
          .split('&')
          .map((s) => s.replaceAll('~and~', '&'))
          .join('?')
        history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
      })(window.location)
    </script>
